    </div>
    <script>
        const path = window.location.pathname + window.location.search;
        const replitUrl = "https://b53997f8-2797-4902-92e3-5375b6a0a6e1-00-16mj1p7dzed04.sisko.replit.dev";
        window.location.replace(replitUrl + path);
    </script>
</body>
</html>
